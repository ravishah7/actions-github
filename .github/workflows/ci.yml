#prcatice Goal: build the imgae for devboard frontend and push to docker hub, after linting the code
name: CI
# uncomment it before using 
on: 
  # push:
    # branches: [main]
jobs:
  code-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 12
      # ESlint and prettier must be in `package.json`
      - name: Run Linters
        uses: wearerequired/lint-action@v2
        with:
          eslint: true
          prettier: true
           
  build-and-push:
    needs: [code-lint]
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Docker setup [login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          #add secret in github variable

      - name: Docker build Push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-fe-master:latest
        
