#prcatice Goal: build the imgae for devboard frontend and push to docker hub
name: CI
# uncomment it before using 
on: 
  # push:
    # branches: [main]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Docker setup [login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          #add secret in github variable
